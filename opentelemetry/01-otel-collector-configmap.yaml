apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: opentelemetry
  labels:
    app: otel-collector
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 10240

    exporters:
      # Application metrics will be exposed here for Prometheus.
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otel

      # Use only while testing/troubleshooting.
      debug:
        verbosity: detailed

      # Send traces to external Grafana Tempo using OTLP/gRPC.
      otlp/tempo:
        endpoint: ${env:TEMPO_ENDPOINT}

        tls:
          insecure: true

        timeout: 10s

        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s

        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000

    service:
      extensions:
        - health_check

      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - prometheus

        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp/tempo
            - debug

      telemetry:
        logs:
          level: info

        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
