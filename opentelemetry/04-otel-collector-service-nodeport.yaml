# Keep this only when Prometheus is running outside Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-prometheus-nodeport
  namespace: opentelemetry
  labels:
    app: otel-collector
spec:
  type: NodePort

  selector:
    app: otel-collector

  ports:
    - name: app-metrics
      port: 8889
      targetPort: app-metrics
      nodePort: 30889
      protocol: TCP
