apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: robodoc-prod
  namespace: robodoc
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              duration: "%DURATION%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_host: "%UPSTREAM_HOST%"
              user_agent: "%REQ(USER-AGENT)%"
              x_u_request_id: "%REQ(X-U-REQUEST-ID)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector
            namespace: opentelemetry
            port: 4317
      samplingRate: 0