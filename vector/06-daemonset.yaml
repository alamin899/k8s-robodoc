apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging

spec:
  selector:
    matchLabels:
      app: vector

  template:
    metadata:
      labels:
        app: vector

    spec:
      serviceAccountName: vector

      containers:
      - name: vector
        image: timberio/vector:0.46.1-alpine

        env:
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: robodoc-backend-production
              key: ELASTICSEARCH_HOST

        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: robodoc-backend-production
              key: ELASTICSEARCH_PORT

        - name: ELASTICSEARCH_USER
          valueFrom:
            configMapKeyRef:
              name: robodoc-backend-production
              key: ELASTICSEARCH_USER

        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: robodoc-backend-production
              key: ELASTICSEARCH_PASSWORD

        volumeMounts:
          - name: config
            mountPath: /etc/vector

          - name: varlogcontainers
            mountPath: /var/log/containers
            readOnly: true

          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true

          - name: vardocker
            mountPath: /var/lib/docker/containers
            readOnly: true

          - name: data
            mountPath: /var/lib/vector

      volumes:
        - name: config
          configMap:
            name: vector-config

        - name: varlogcontainers
          hostPath:
            path: /var/log/containers

        - name: varlogpods
          hostPath:
            path: /var/log/pods

        - name: vardocker
          hostPath:
            path: /var/lib/docker/containers

        - name: data
          hostPath:
            path: /var/lib/vector